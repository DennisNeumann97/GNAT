[project]
name = "gnat"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "camb==1.6.6",
    "getdist==1.7.4",
    "h5py==3.10.0",
    "ipykernel==6.29.5",

    # JAX stack (stable combo)
    "jax==0.4.28",
    "jaxlib==0.4.28",
    "ml-dtypes==0.3.2",

    "matplotlib==3.8.4",
    "matplotlib-inline==0.1.7",
    "mcfit==0.0.22",
    "nautilus-sampler==1.0.5",

    "numpy==1.26.4",
    "pandas==2.2.2",

    # Important: leave this buildable
    "pyccl==3.3.2",

    "pytest==8.3.5",
    "tqdm==4.67.1",
    "typing-extensions>=4.5.0",
    "scikit-learn==1.4.2",
    "scipy==1.15.2",
]

